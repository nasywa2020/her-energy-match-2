const ENDINGS={

const PROP=["🏠","🏛️","🧵","🌿","🗣️","🤝","☀️"];
const clamp=v=>Math.max(0,Math.min(100,v));
let st,day,picks,L,segs,plats,P,qx,qdone,obs,hens,res,rt=0,fr=0,cd=0,tmsg='',lastSafe,keys={},mode="intro",toast=0;
function start(){st={...START};day=0;picks=[];hud();intro();}
function hud(up={}){$("hud").innerHTML=STATS.map(([k,i,n])=>`<div class="stat ${up[k]?'up':''}">${i}<b>${st[k]}</b><span>${n}</span></div>`).join("");}
function build(i){
 L=2700+i*200;const gaps=[];
 for(let n=1;n<=2+(i>>1);n++)gaps.push([450+n*430+i*15,100]);
 segs=[];let x=0;gaps.forEach(([gx,w])=>{segs.push([x,gx,GY]);x=gx+w});segs.push([x,L,GY]);
 plats=gaps.map(([gx])=>[gx-110,GY-95,320]);
 plats.push([L-300,GY-110,140]);
 P={x:60,y:GY-44,w:30,h:44,vx:0,vy:0,on:false};lastSafe=60;
 qx=gaps[gaps.length-1][0]+400;qdone=false;res=null;rt=0;obs=[];hens=[];
 let n=0;for(let x=330;x<L-260;x+=150){n++;if(x>qx-230&&x<qx+470)continue;if(gaps.some(([gx])=>x>gx-130&&x<gx+190))continue;
  const t=(n+i)%3;if(t===2)hens.push([x,GY-36,36,36,x,70]);else obs.push([x,GY-(t?70:40),40,t?70:40,t])}
}
function intro(){
 mode="intro";build(day);$("dl").textContent=`Hari ${day+1} dari 7 · ${DAYS[day].p}`;

}

function pick(i){
 const o=DAYS[day].o[i],fx=o[2];picks.push(i);
 STATS.forEach(([k])=>{if(fx[k])st[k]=clamp(st[k]+fx[k])});hud(fx);qdone=true;
 res={i,t:o[0],d:o[1],c:STATS.filter(([k])=>fx[k]).map(([k,ic,n])=>`${ic} ${n} ${fx[k]>0?'+':''}${fx[k]}`).join('    ')||'Tidak ada perubahan nilai'};rt=520;
}

// kontrol
const hold=(id,k)=>{const b=$(id);["pointerdown"].forEach(e=>b.addEventListener(e,ev=>{ev.preventDefault();keys[k]=1}));["pointerup","pointerleave","pointercancel"].forEach(e=>b.addEventListener(e,()=>keys[k]=0))};
hold("bl","L");hold("br","R");hold("bj","J");
addEventListener("keydown",e=>{const m={ArrowLeft:"L",ArrowRight:"R",ArrowUp:"J"," ":"J",a:"L",d:"R",w:"J"}[e.key];if(m){keys[m]=1;e.preventDefault()}});
